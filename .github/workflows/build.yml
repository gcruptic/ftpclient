name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Project Infrastructure
        run: |
          mkdir -p app/src/main/java/com/example/ftpclient
          mkdir -p app/src/main/res/values

          # 1. settings.gradle.kts
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "FtpClient"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts

          # 2. build.gradle.kts (root)
          echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts

          # 3. gradle.properties
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'android.nonTransitiveRClass=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m' >> gradle.properties
          echo 'org.gradle.daemon=false' >> gradle.properties

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ftpclient"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ftpclient"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              
              // FTP Client
              implementation("commons-net:commons-net:3.10.0")
              
              // Google Code Scanner (ML Kit)
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")

              // Gson для сохранения истории подключений
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          # 5. AndroidManifest.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="true" android:label="FTP Client" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          # 6. MainActivity.kt (все новые фичи + сохранение истории)
          cat << 'EOF' > app/src/main/java/com/example/ftpclient/MainActivity.kt
          package com.example.ftpclient

          import android.content.Context
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.provider.OpenableColumns
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.automirrored.filled.ExitToApp
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning
          import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions
          import com.google.mlkit.vision.barcode.common.Barcode
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.apache.commons.net.ftp.FTP
          import org.apache.commons.net.ftp.FTPClient
          import org.apache.commons.net.ftp.FTPFile
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream
          import java.net.URI

          data class FtpConfig(
              val name: String = "Новое подключение",
              val host: String = "",
              val port: Int = 21,
              val user: String = "anonymous",
              val pass: String = ""
          )

          object HistoryManager {
              private const val PREFS_NAME = "ftp_history_prefs"
              private const val KEY_HISTORY = "history_list"
              private val gson = Gson()

              fun saveConnection(context: Context, config: FtpConfig) {
                  val list = getHistory(context).toMutableList()
                  list.removeAll { it.host == config.host && it.port == config.port && it.user == config.user }
                  list.add(0, config)
                  val json = gson.toJson(list)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_HISTORY, json).apply()
              }

              fun getHistory(context: Context): List<FtpConfig> {
                  val json = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_HISTORY, null) ?: return emptyList()
                  val type = object : TypeToken<List<FtpConfig>>() {}.type
                  return try { gson.fromJson(json, type) } catch (e: Exception) { emptyList() }
              }

              fun deleteConnection(context: Context, config: FtpConfig): List<FtpConfig> {
                  val list = getHistory(context).toMutableList()
                  list.removeAll { it.host == config.host && it.port == config.port && it.user == config.user }
                  val json = gson.toJson(list)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_HISTORY, json).apply()
                  return list
              }
          }

          class FtpManager {
              private val ftpClient = FTPClient()

              suspend fun connect(config: FtpConfig): Boolean = withContext(Dispatchers.IO) {
                  try {
                      ftpClient.defaultTimeout = 10000
                      ftpClient.connectTimeout = 10000
                      ftpClient.connect(config.host, config.port)
                      ftpClient.soTimeout = 10000
                      
                      val success = ftpClient.login(config.user, config.pass)
                      if (success) {
                          ftpClient.controlEncoding = "UTF-8"
                          ftpClient.enterLocalPassiveMode()
                          ftpClient.setFileType(FTP.BINARY_FILE_TYPE)
                          ftpClient.sendCommand("OPTS UTF8 ON")
                      }
                      success
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              suspend fun listFiles(path: String = "/"): List<FTPFile> = withContext(Dispatchers.IO) {
                  try {
                      if (path.isNotEmpty()) ftpClient.changeWorkingDirectory(path)
                      var files = ftpClient.listFiles().toList()
                      if (files.isEmpty()) {
                          ftpClient.enterLocalActiveMode()
                          files = ftpClient.listFiles().toList()
                      }
                      if (files.isEmpty()) {
                          ftpClient.enterLocalPassiveMode()
                          files = ftpClient.mlistDir().toList()
                      }
                      if (files.isEmpty()) {
                          val names = ftpClient.listNames() ?: emptyArray()
                          files = names.map { name ->
                              val file = FTPFile()
                              file.name = name
                              file.type = if (!name.contains(".")) FTPFile.DIRECTORY_TYPE else FTPFile.FILE_TYPE
                              file
                          }
                      }
                      files.filter { it.name != "." && it.name != ".." }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              suspend fun createDirectory(dirName: String): Boolean = withContext(Dispatchers.IO) {
                  try { ftpClient.makeDirectory(dirName) } catch (e: Exception) { false }
              }

              suspend fun deleteItem(path: String, isDirectory: Boolean): Boolean = withContext(Dispatchers.IO) {
                  try {
                      if (isDirectory) ftpClient.removeDirectory(path) else ftpClient.deleteFile(path)
                  } catch (e: Exception) { false }
              }

              suspend fun downloadFile(
                  remoteFilePath: String,
                  destinationFile: File,
                  onProgress: (Float) -> Unit = {}
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val fileStream: OutputStream = FileOutputStream(destinationFile)
                      val files = ftpClient.listFiles(remoteFilePath)
                      val fileSize = if (files.isNotEmpty()) files[0].size else -1L

                      val success = if (fileSize > 0) {
                          val countingStream = object : OutputStream() {
                              var totalBytesRead = 0L
                              override fun write(b: Int) {
                                  fileStream.write(b)
                                  totalBytesRead++
                                  onProgress(totalBytesRead.toFloat() / fileSize)
                              }
                              override fun write(b: ByteArray, off: Int, len: Int) {
                                  fileStream.write(b, off, len)
                                  totalBytesRead += len
                                  onProgress(totalBytesRead.toFloat() / fileSize)
                              }
                              override fun flush() = fileStream.flush()
                              override fun close() = fileStream.close()
                          }
                          ftpClient.retrieveFile(remoteFilePath, countingStream)
                      } else {
                          ftpClient.retrieveFile(remoteFilePath, fileStream)
                      }
                      fileStream.close()
                      success
                  } catch (e: Exception) {
                      false
                  }
              }

              suspend fun uploadFile(
                  context: Context,
                  fileUri: Uri,
                  remoteDirPath: String,
                  onProgress: (Float) -> Unit = {}
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val contentResolver = context.contentResolver
                      var fileName = "uploaded_file"
                      var fileSize = -1L

                      contentResolver.query(fileUri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          val sizeIndex = cursor.getColumnIndex(OpenableColumns.SIZE)
                          if (cursor.moveToFirst()) {
                              if (nameIndex != -1) fileName = cursor.getString(nameIndex)
                              if (sizeIndex != -1) fileSize = cursor.getLong(sizeIndex)
                          }
                      }

                      val remoteFilePath = if (remoteDirPath.endsWith("/")) "$remoteDirPath$fileName" else "$remoteDirPath/$fileName"
                      ftpClient.setFileType(FTP.BINARY_FILE_TYPE)

                      contentResolver.openInputStream(fileUri)?.use { inputStream ->
                          val outputStream: OutputStream = ftpClient.storeFileStream(remoteFilePath) ?: return@withContext false
                          val buffer = ByteArray(4096)
                          var bytesRead: Int
                          var totalBytesUploaded = 0L

                          while (inputStream.read(buffer).also { bytesRead = it } != -1) {
                              outputStream.write(buffer, 0, bytesRead)
                              totalBytesUploaded += bytesRead
                              if (fileSize > 0) onProgress(totalBytesUploaded.toFloat() / fileSize)
                          }
                          outputStream.flush()
                          outputStream.close()
                          ftpClient.completePendingCommand()
                      } ?: false
                  } catch (e: Exception) {
                      false
                  }
              }

              fun disconnect() {
                  if (ftpClient.isConnected) {
                      try {
                          ftpClient.logout()
                          ftpClient.disconnect()
                      } catch (_: Exception) {}
                  }
              }

              companion object {
                  fun parseQrCode(qrData: String): FtpConfig? {
                      return try {
                          val uri = URI(qrData)
                          if (uri.scheme == "ftp") {
                              val userInfo = uri.userInfo?.split(":") ?: listOf("", "")
                              FtpConfig(
                                  name = uri.host ?: "FTP Server",
                                  host = uri.host ?: "",
                                  port = if (uri.port != -1) uri.port else 21,
                                  user = userInfo.getOrNull(0) ?: "anonymous",
                                  pass = userInfo.getOrNull(1) ?: ""
                              )
                          } else null
                      } catch (e: Exception) { null }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              private val ftpManager = FtpManager()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val systemDark = isSystemInDarkTheme()
                      var isDarkTheme by remember { mutableStateOf(systemDark) }
                      var isConnected by remember { mutableStateOf(false) }

                      val colorScheme = if (isDarkTheme) darkColorScheme() else lightColorScheme()

                      MaterialTheme(colorScheme = colorScheme) {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              if (isConnected) {
                                  FtpFileListScreen(
                                      ftpManager = ftpManager,
                                      isDarkTheme = isDarkTheme,
                                      onToggleTheme = { isDarkTheme = !isDarkTheme },
                                      onDisconnect = { isConnected = false }
                                  )
                              } else {
                                  FtpConnectScreen(
                                      ftpManager = ftpManager,
                                      isDarkTheme = isDarkTheme,
                                      onToggleTheme = { isDarkTheme = !isDarkTheme },
                                      onConnected = { isConnected = true }
                                  )
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  ftpManager.disconnect()
              }
          }

          @Composable
          fun FtpConnectScreen(
              ftpManager: FtpManager,
              isDarkTheme: Boolean,
              onToggleTheme: () -> Unit,
              onConnected: () -> Unit
          ) {
              val context = LocalContext.current
              var host by remember { mutableStateOf("") }
              var port by remember { mutableStateOf("21") }
              var user by remember { mutableStateOf("") }
              var pass by remember { mutableStateOf("") }
              var isConnecting by remember { mutableStateOf(false) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              val scope = rememberCoroutineScope()

              var historyList by remember { mutableStateOf(HistoryManager.getHistory(context)) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.Top,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text("FTP Подключение", style = MaterialTheme.typography.headlineSmall)
                      IconButton(onClick = onToggleTheme) {
                          Icon(
                              imageVector = if (isDarkTheme) Icons.Default.LightMode else Icons.Default.DarkMode,
                              contentDescription = "Тема"
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  OutlinedButton(
                      onClick = {
                          val options = GmsBarcodeScanning.getClient(context, GmsBarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build())
                          options.startScan()
                              .addOnSuccessListener { barcode ->
                                  val rawValue = barcode.rawValue
                                  if (rawValue != null) {
                                      val parsedConfig = FtpManager.parseQrCode(rawValue)
                                      if (parsedConfig != null) {
                                          host = parsedConfig.host
                                          port = parsedConfig.port.toString()
                                          user = parsedConfig.user
                                          pass = parsedConfig.pass
                                      } else { errorMsg = "Неверный формат QR-кода" }
                                  }
                              }
                              .addOnFailureListener { errorMsg = "Ошибка сканирования" }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.QrCodeScanner, contentDescription = null)
                      Spacer(modifier = Modifier.width(8.dp))
                      Text("Сканировать QR-код")
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(value = host, onValueChange = { host = it }, label = { Text("Хост / IP") }, modifier = Modifier.fillMaxWidth())
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(value = port, onValueChange = { port = it }, label = { Text("Порт") }, modifier = Modifier.weight(1f))
                      OutlinedTextField(value = user, onValueChange = { user = it }, label = { Text("Логин") }, modifier = Modifier.weight(2f))
                  }
                  OutlinedTextField(value = pass, onValueChange = { pass = it }, label = { Text("Пароль") }, modifier = Modifier.fillMaxWidth())

                  Spacer(modifier = Modifier.height(12.dp))

                  Button(
                      onClick = {
                          scope.launch {
                              isConnecting = true
                              errorMsg = null
                              val config = FtpConfig(
                                  host = host,
                                  port = port.toIntOrNull() ?: 21,
                                  user = user.ifEmpty { "anonymous" },
                                  pass = pass
                              )
                              val success = ftpManager.connect(config)
                              isConnecting = false
                              if (success) {
                                  HistoryManager.saveConnection(context, config)
                                  onConnected()
                              } else {
                                  errorMsg = "Ошибка подключения к серверу"
                              }
                          }
                      },
                      enabled = !isConnecting && host.isNotEmpty(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      if (isConnecting) CircularProgressIndicator(modifier = Modifier.size(24.dp)) else Text("Подключиться")
                  }

                  errorMsg?.let {
                      Spacer(modifier = Modifier.height(8.dp))
                      Text(it, color = MaterialTheme.colorScheme.error)
                  }

                  if (historyList.isNotEmpty()) {
                      Spacer(modifier = Modifier.height(16.dp))
                      HorizontalDivider()
                      Spacer(modifier = Modifier.height(8.dp))
                      Text("Сохраненные подключения", style = MaterialTheme.typography.titleMedium)
                      Spacer(modifier = Modifier.height(8.dp))

                      LazyColumn(modifier = Modifier.fillMaxWidth()) {
                          items(historyList) { item ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 4.dp)
                                      .clickable {
                                          host = item.host
                                          port = item.port.toString()
                                          user = item.user
                                          pass = item.pass
                                      }
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(12.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column {
                                          Text("${item.user}@${item.host}:${item.port}", style = MaterialTheme.typography.bodyLarge)
                                      }
                                      IconButton(onClick = { historyList = HistoryManager.deleteConnection(context, item) }) {
                                          Icon(Icons.Default.Delete, contentDescription = "Удалить")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FtpFileListScreen(
              ftpManager: FtpManager,
              isDarkTheme: Boolean,
              onToggleTheme: () -> Unit,
              onDisconnect: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var currentPath by remember { mutableStateOf("/") }
              var fileList by remember { mutableStateOf<List<FTPFile>>(emptyList()) }
              var isLoading by remember { mutableStateOf(true) }

              var downloadingFile by remember { mutableStateOf<String?>(null) }
              var downloadProgress by remember { mutableFloatStateOf(0f) }

              var isUploading by remember { mutableStateOf(false) }
              var uploadProgress by remember { mutableFloatStateOf(0f) }

              var showCreateDirDialog by remember { mutableStateOf(false) }
              var newDirName by remember { mutableStateOf("") }

              fun loadDirectory(path: String) {
                  scope.launch {
                      isLoading = true
                      fileList = ftpManager.listFiles(path)
                      currentPath = path
                      isLoading = false
                  }
              }

              LaunchedEffect(Unit) { loadDirectory("/") }

              BackHandler(enabled = currentPath != "/") {
                  val parentPath = currentPath.substringBeforeLast('/', "").ifEmpty { "/" }
                  loadDirectory(parentPath)
              }

              val filePickerLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  uri?.let { selectedUri ->
                      scope.launch {
                          isUploading = true
                          uploadProgress = 0f
                          val success = ftpManager.uploadFile(context, selectedUri, currentPath) { uploadProgress = it }
                          isUploading = false
                          if (success) {
                              Toast.makeText(context, "Файл загружен!", Toast.LENGTH_SHORT).show()
                              loadDirectory(currentPath)
                          } else {
                              Toast.makeText(context, "Ошибка загрузки файла", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text(text = currentPath, maxLines = 1) },
                          navigationIcon = {
                              if (currentPath != "/") {
                                  IconButton(onClick = {
                                      val parentPath = currentPath.substringBeforeLast('/', "").ifEmpty { "/" }
                                      loadDirectory(parentPath)
                                  }) {
                                      Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Назад")
                                  }
                              }
                          },
                          actions = {
                              IconButton(onClick = { showCreateDirDialog = true }) {
                                  Icon(Icons.Default.CreateNewFolder, contentDescription = "Создать папку")
                              }
                              IconButton(onClick = onToggleTheme) {
                                  Icon(
                                      imageVector = if (isDarkTheme) Icons.Default.LightMode else Icons.Default.DarkMode,
                                      contentDescription = "Тема"
                                  )
                              }
                              IconButton(onClick = {
                                  scope.launch {
                                      ftpManager.disconnect()
                                      onDisconnect()
                                  }
                              }) {
                                  Icon(Icons.AutoMirrored.Filled.ExitToApp, contentDescription = "Отключиться")
                              }
                          }
                      )
                  },
                  floatingActionButton = {
                      FloatingActionButton(
                          onClick = { filePickerLauncher.launch("*/*") },
                          containerColor = MaterialTheme.colorScheme.primary
                      ) {
                          Icon(Icons.Default.FileUpload, contentDescription = "Загрузить")
                      }
                  }
              ) { paddingValues ->
                  Box(modifier = Modifier.fillMaxSize().padding(paddingValues)) {
                      if (isLoading) {
                          CircularProgressIndicator(modifier = Modifier.align(Alignment.Center))
                      } else if (fileList.isEmpty()) {
                          Text(text = "Папка пуста", modifier = Modifier.align(Alignment.Center))
                      } else {
                          LazyColumn(modifier = Modifier.fillMaxSize()) {
                              items(fileList) { file ->
                                  val itemPath = if (currentPath.endsWith("/")) "$currentPath${file.name}" else "$currentPath/${file.name}"
                                  
                                  ListItem(
                                      modifier = Modifier.clickable {
                                          if (file.isDirectory) loadDirectory(itemPath)
                                      },
                                      headlineContent = { Text(file.name) },
                                      leadingContent = {
                                          Icon(
                                              imageVector = if (file.isDirectory) Icons.Default.Folder else Icons.Default.InsertDriveFile,
                                              contentDescription = null
                                          )
                                      },
                                      trailingContent = {
                                          Row {
                                              if (!file.isDirectory) {
                                                  if (downloadingFile == file.name) {
                                                      CircularProgressIndicator(progress = { downloadProgress }, modifier = Modifier.size(24.dp))
                                                  } else {
                                                      IconButton(onClick = {
                                                          scope.launch {
                                                              downloadingFile = file.name
                                                              downloadProgress = 0f
                                                              val downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                                              val destFile = File(downloadsDir, file.name)
                                                              val success = ftpManager.downloadFile(itemPath, destFile) { downloadProgress = it }
                                                              downloadingFile = null
                                                              Toast.makeText(context, if (success) "Сохранено в Downloads" else "Ошибка скачивания", Toast.LENGTH_SHORT).show()
                                                          }
                                                      }) {
                                                          Icon(Icons.Default.FileDownload, contentDescription = "Скачать")
                                                      }
                                                  }
                                              }
                                              IconButton(onClick = {
                                                  scope.launch {
                                                      val success = ftpManager.deleteItem(itemPath, file.isDirectory)
                                                      if (success) {
                                                          Toast.makeText(context, "Удалено", Toast.LENGTH_SHORT).show()
                                                          loadDirectory(currentPath)
                                                      } else {
                                                          Toast.makeText(context, "Ошибка удаления", Toast.LENGTH_SHORT).show()
                                                      }
                                                  }
                                              }) {
                                                  Icon(Icons.Default.Delete, contentDescription = "Удалить")
                                              }
                                          }
                                      }
                                  )
                                  HorizontalDivider()
                              }
                          }
                      }

                      if (isUploading) {
                          Card(modifier = Modifier.align(Alignment.BottomCenter).padding(16.dp).fillMaxWidth()) {
                              Column(modifier = Modifier.padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("Загрузка файла...")
                                  Spacer(modifier = Modifier.height(8.dp))
                                  LinearProgressIndicator(progress = { uploadProgress }, modifier = Modifier.fillMaxWidth())
                              }
                          }
                      }
                  }

                  if (showCreateDirDialog) {
                      AlertDialog(
                          onDismissRequest = { showCreateDirDialog = false },
                          title = { Text("Новая папка") },
                          text = {
                              OutlinedTextField(
                                  value = newDirName,
                                  onValueChange = { newDirName = it },
                                  label = { Text("Название папки") }
                              )
                          },
                          confirmButton = {
                              TextButton(onClick = {
                                  if (newDirName.isNotEmpty()) {
                                      scope.launch {
                                          val success = ftpManager.createDirectory("$currentPath/$newDirName")
                                          showCreateDirDialog = false
                                          newDirName = ""
                                          if (success) loadDirectory(currentPath) else Toast.makeText(context, "Ошибка создания папки", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              }) { Text("Создать") }
                          },
                          dismissButton = {
                              TextButton(onClick = { showCreateDirDialog = false }) { Text("Отмена") }
                          }
                      )
                  }
              }
          }
          EOF

      - name: Build APK with Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
